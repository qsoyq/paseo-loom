name: Feature Request
description: Propose a new skill, workflow, or repository capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this create?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: What should not be changed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Use checkboxes for concrete acceptance criteria.
      value: |
        - [ ] TBD
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should the change be tested or reviewed?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
        - P4
    validations:
      required: true
