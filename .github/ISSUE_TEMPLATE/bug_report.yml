name: Bug Report
description: Report broken behavior, failed validation, or a regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: What failed, and where did it happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: List exact steps, commands, inputs, or files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands, logs, screenshots, or checks that demonstrate the issue.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
        - P4
    validations:
      required: true
